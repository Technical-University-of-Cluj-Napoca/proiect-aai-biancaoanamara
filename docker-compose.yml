version: '3.8'

services:
  agentic-code-review:
    build: .
    container_name: agentic-code-review-app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./vectorstore:/app/vectorstore
      - ./memory:/app/memory
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
